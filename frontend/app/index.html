<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SearchOps — Research Archive</title>
    <meta
      name="description"
      content="Run a question through an autonomous research pipeline and get a report whose claims are individually cited and graded."
    />
    <!--
      Four voices, strictly assigned (see DESIGN.md):
        Fraunces       display  — report titles, section heads, the mark
        Source Serif 4 reading  — the report body, at a 68ch measure
        Instrument Sans interface — all chrome
        JetBrains Mono data     — measured numbers and IDs only
      The stacks fall back to Georgia/system-ui when the network is unavailable,
      so the page still renders. The font link lives here rather than in the
      stylesheet because a CSS @import after @tailwind is invalid and PostCSS
      rejects the whole file.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-paper text-ink font-sans antialiased overflow-hidden">
    <!--
      Selection is intentionally NOT disabled here. A research workbench whose
      entire job is reading and quoting reports must let the user select and
      copy text. Individual components that should not be selectable (status
      chrome, telemetry readouts) opt out with their own select-none class.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
