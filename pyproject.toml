[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "searchops"
version = "0.1.0"
description = "Enterprise Autonomous Technology Intelligence Platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "SEARCHOps Platform Team" }]
keywords = [
    "ai",
    "agents",
    "research",
    "langgraph",
    "langchain",
    "knowledge-graph",
    "enterprise",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    # ── Web Framework ──────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx[http2]>=0.27.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    # ── LLM Orchestration ─────────────────────────────────────────────────
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langfuse>=2.50.0",
    # ── Data Validation ───────────────────────────────────────────────────
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # ── Database ──────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "psycopg[binary,pool]>=3.2.0",
    # ── Cache & Streams ───────────────────────────────────────────────────
    "redis[hiredis]>=5.1.0",
    # ── Vector Store ──────────────────────────────────────────────────────
    "qdrant-client>=1.12.0",
    # ── Graph Database ────────────────────────────────────────────────────
    "neo4j>=5.26.0",
    # ── Observability ─────────────────────────────────────────────────────
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-instrumentation-asyncpg>=0.49b0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    # ── Retry / Resilience ────────────────────────────────────────────────
    "tenacity>=9.0.0",
    # ── Security ──────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0.0",
    # ── Scraping ──────────────────────────────────────────────────────────
    "firecrawl-py>=1.5.0",
    "playwright>=1.48.0",
    # ── Serialization ─────────────────────────────────────────────────────
    "orjson>=3.10.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    # ── Utilities ─────────────────────────────────────────────────────────
    "anyio>=4.6.0",
    "rich>=13.9.0",
    "click>=8.1.7",
    "lagom>=2.7.0",
    "shortuuid>=1.0.13",
    "arrow>=1.3.0",
    "cachetools>=5.5.0",
    "langchain-google-genai>=4.3.2",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "curl-cffi>=0.7.0",
    "selectolax>=0.3.21",
    "crawl4ai>=0.4.0",
    "markdownify>=0.13.1",
    "pymupdf>=1.24.0",
    "duckdb>=1.1.0",
    "docling>=2.0.0",
    "datasketch>=1.6.0",
    "outlines-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "faker>=30.0.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "faker>=30.0.0",
    "respx>=0.21.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
searchops = "searchops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/searchops"]

[tool.hatch.metadata]
allow-direct-references = true

# ── uv ────────────────────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "faker>=30.0.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "aiosqlite>=0.20.0",
    "httpx2>=2.9.1",
    "fakeredis>=2.37.0",
    "ruff>=0.16.10",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
ignore = [ # Missing type annotation for self # Missing type annotation for cls
    "S101",   # Use of assert (allowed in tests)
    "S110",   # try-except-pass (used in cleanup paths where errors are intentionally ignored)
    "S311",   # Suspicious crypto — used for non-security identifiers in scraping code
    "E501",   # Line too long (handled by formatter)
    "ANN401", # Dynamic return type (Any) — pervasive in LLM response handling
    # UP040 rewrites `X: TypeAlias = str` to PEP 695 `type X = str`, which is NOT
    # callable at runtime — breaks code that does `AgentId(...)`. Never autofix this.
    "UP040",
]

[tool.ruff.lint.isort]
known-first-party = ["searchops"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S106", "SIM117", "B008", "S105", "S107", "T201"]
"src/searchops/api/main.py" = ["E402"]
"src/searchops/api/v1/research.py" = ["E402", "B008"]
"src/searchops/scraping/browser_pool.py" = ["SIM117"]
"src/searchops/infrastructure/vector/qdrant.py" = ["E402"]
"src/searchops/scraping/pipeline.py" = ["E402"]
"src/searchops/llm/router.py" = ["S106"]
"src/searchops/search/orchestrator.py" = ["S324"]
"src/searchops/config/subsystems/api.py" = ["S104"]
# TC001 must be ignored in these three files: LangGraph calls get_type_hints()
# on ResearchState at graph-build time and Pydantic resolves forward refs at
# model-creation time — both need the real objects in module globals, not a
# TYPE_CHECKING-only import.
"src/searchops/orchestration/states/research_state.py" = ["TC001"]
"src/searchops/knowledge/domain/entity.py" = ["TC001"]
"src/searchops/core/interfaces/agent.py" = ["TC001"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

# Re-export shims only re-publish names from sibling modules; implicit re-export
# is the intended behaviour there, not an accident.
[[tool.mypy.overrides]]
module = ["searchops.infrastructure.graph.neo4j", "searchops.infrastructure.vector.qdrant", "searchops.search.contracts"]
implicit_reexport = true

# Redis Streams is a topic-based transport, not an event-type-keyed bus.
# Its signatures intentionally diverge from IEventBus.
[[tool.mypy.overrides]]
module = "searchops.infrastructure.messaging.redis_streams"
disable_error_code = ["override"]

# pydantic-settings validators legitimately return Any from json.loads.
[[tool.mypy.overrides]]
module = ["searchops.config.subsystems.api", "searchops.config.subsystems.security"]
disable_error_code = ["no-any-return"]

# python-pptx and python-docx ship without usable type information: the
# stubs model Presentation() as returning Optional and omit slide_layouts, so
# strict mode reports errors on correct, runtime-verified calls. Both libraries
# are exercised by tests that open the produced files.
[[tool.mypy.overrides]]
module = ["searchops.application.exports.deck", "searchops.application.exports.docx_export"]
disable_error_code = [
    "attr-defined",
    "union-attr",
    "arg-type",
    "assignment",
    "var-annotated",
    "valid-type",
    "type-arg",
]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
    "--cov=src/searchops",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=75",
]
markers = [
    "unit: Pure unit tests with no external dependencies",
    "integration: Tests that require live infrastructure",
    "slow: Tests that take more than 1 second",
    "agent: Tests for agent behaviour",
    "graph: Tests for LangGraph orchestration",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Windows Proactor event loop emits ResourceWarning during asyncio cleanup
    # when curl_cffi / crawl4ai browser subprocess pipes are garbage-collected
    # after the loop closes.  These are OS-level teardown artefacts, not code bugs.
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::ResourceWarning",
]


# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/searchops"]
omit = ["tests/*", "**/__init__.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
